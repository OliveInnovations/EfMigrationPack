name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build all packages
        shell: pwsh
        run: ./build.ps1

      - uses: actions/upload-artifact@v5
        with:
          name: packages
          path: artifacts/packages
