name: Release

# Publishes every package to nuget.org (see RELEASING.md). Start it either way:
#   - Actions tab → Release → "Run workflow", entering the release number (e.g. 0.0), or
#   - push a tag like v0.0.
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release number, minor.patch (e.g. 0.0 publishes EfMigrationPack 8.0.0 and dotnet-ef-pack 1.0.0)'
        required: true
        type: string
  push:
    tags: ['v*.*']

permissions:
  contents: write   # create the tag and the GitHub release
  id-token: write   # trusted publishing: lets nuget.org verify this workflow

jobs:
  release:
    runs-on: ubuntu-latest
    # Must match the Environment on the nuget.org trusted publishing policy. GitHub creates the
    # environment on first use; add required reviewers to it (Settings → Environments) to approve each release.
    environment: production
    steps:
      - uses: actions/checkout@v5

      # .NET 6 and 8 runtimes are for the integration test's net6.0 and net8.0 test apps.
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            6.0.x
            8.0.x
          global-json-file: global.json

      - name: Work out the release number
        id: version
        shell: bash
        env:
          INPUT_RELEASE: ${{ inputs.release }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "Run the release from the main branch." >&2
              exit 1
            fi
            release="${INPUT_RELEASE#v}"
          else
            release="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$release" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "Release number '$release' must look like 1.0 (minor.patch)." >&2
            exit 1
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: Build all packages
        shell: pwsh
        run: ./build.ps1 -PackRelease '${{ steps.version.outputs.release }}' -Release

      # The exact packages about to be published, against every EF Core major. Nothing is pushed if this fails.
      - name: Integration test
        shell: pwsh
        run: ./tests/Integration/Run-IntegrationTests.ps1

      # Trusted publishing: exchanges this workflow's GitHub identity for a one-hour nuget.org key,
      # so no long-lived API key is stored. Requires a trusted publishing policy on nuget.org (RELEASING.md).
      - name: Log in to nuget.org
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: >
          dotnet nuget push "artifacts/packages/*.nupkg"
          --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      # Creates the v<release> tag on this commit if it doesn't exist (manual runs), and the GitHub release.
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.release }}
          target_commitish: ${{ github.sha }}
          files: artifacts/packages/*
          generate_release_notes: true
